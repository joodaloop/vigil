<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f9f9f9; color: #111; padding: 2rem; }
  h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: 1.5rem; }
  .controls { display: flex; gap: 1rem; margin-bottom: 2rem; align-items: center; flex-wrap: wrap; }
  .controls input, .controls select { padding: 0.4rem 0.6rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
  .controls button { padding: 0.4rem 1rem; background: #111; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
  .stat { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 1.2rem; }
  .stat .label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat .value { font-size: 2rem; font-weight: 600; margin-top: 0.3rem; }
  .tables { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .table-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 1.2rem; }
  .table-card h2 { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.8rem; color: #555; text-transform: uppercase; letter-spacing: 0.05em; }
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  td { padding: 0.35rem 0; border-bottom: 1px solid #f0f0f0; }
  td:last-child { text-align: right; color: #555; }
  .error { color: #c00; font-size: 0.875rem; margin-top: 0.5rem; }
  .loading { color: #888; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/client/main.tsx"></script>
</body>
</html>
